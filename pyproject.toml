[build-system]
requires = ["hatchling>=1.5.0", "hatch-nodejs-version>=0.3.2", "jupyter-builder>=1.2.0,<2"]
build-backend = "hatchling.build"

[project]
name = "jupyter_dag"
readme = "README.md"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
requires-python = ">=3.10"
classifiers = [
    "Framework :: Jupyter",
    "Framework :: Jupyter :: JupyterLab",
    "Framework :: Jupyter :: JupyterLab :: 4",
    "Framework :: Jupyter :: JupyterLab :: Extensions",
    "Framework :: Jupyter :: JupyterLab :: Extensions :: Prebuilt",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "jupyter_server>=2.13.0,<3",
    "ipykernel>=7.3,<8",
    "ipython>=8.10",
    "jupyter_client>=8.6,<9",
    "comm>=0.2",
]
dynamic = ["version", "description", "authors", "urls", "keywords"]

[project.optional-dependencies]
dev = [
    "jupyterlab>=4",
    "jupyter-builder>=1.2.0",
]
test = [
    "coverage",
    "pytest",
    "pytest-asyncio",
    "pytest-cov",
    "pytest-timeout",
    "pytest-jupyter[server]>=0.6.0"
]

[project.scripts]
jupyter-dag-kernel = "jupyter_dag.kernel.install:main"

[project.entry-points."jupyter_client.kernel_provisioners"]
jupyter-dag-provisioner = "jupyter_dag.provisioner:DagKernelProvisioner"

[tool.hatch.version]
source = "nodejs"

[tool.hatch.metadata.hooks.nodejs]
fields = ["description", "authors", "urls", "keywords"]

[tool.hatch.build.targets.sdist]
artifacts = ["jupyter_dag/labextension"]
exclude = [".github", "binder", ".claude"]

[tool.hatch.build.targets.wheel.shared-data]
"jupyter_dag/labextension" = "share/jupyter/labextensions/@telamonian/jupyter-dag"
"install.json" = "share/jupyter/labextensions/@telamonian/jupyter-dag/install.json"
"jupyter-config/server-config" = "etc/jupyter/jupyter_server_config.d"
"jupyter-config/kernels/jupyter-dag" = "share/jupyter/kernels/jupyter-dag"

[tool.hatch.build.hooks.version]
path = "jupyter_dag/_version.py"

[tool.hatch.build.hooks.jupyter-builder]
dependencies = ["hatch-jupyter-builder>=0.5"]
build-function = "hatch_jupyter_builder.npm_builder"
ensured-targets = [
    "jupyter_dag/labextension/static/style.js",
    "jupyter_dag/labextension/package.json",
]
skip-if-exists = ["jupyter_dag/labextension/static/style.js"]

[tool.hatch.build.hooks.jupyter-builder.build-kwargs]
build_cmd = "build:prod"
npm = ["jlpm"]

[tool.hatch.build.hooks.jupyter-builder.editable-build-kwargs]
build_cmd = "install:extension"
npm = ["jlpm"]
source_dir = "src"
build_dir = "jupyter_dag/labextension"

[tool.jupyter-releaser.options]
version_cmd = "hatch version"

[tool.jupyter-releaser.hooks]
before-build-npm = [
    "python -m pip install 'jupyter-builder>=1.2.0,<2'",
    "jlpm",
    "jlpm build:prod"
]
before-build-python = ["jlpm clean:all"]

[tool.check-wheel-contents]
ignore = ["W002"]
